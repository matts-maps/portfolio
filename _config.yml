title: "Fantail GIS"
description: "Maps, Projects, and Visual Work"
author: "Matt Sims"

url: "https://matts-maps.github.io"
baseurl: "/portfolio" # Correctly targets your subfolder repository layout

markdown: kramdown
theme: minima
paginate: 5
paginate_path: "/posts/page:num/"

exclude:
  - scripts
  - assets/data/migration-report.md

include:
  - assets

collections:
  projects:
    output: true
    permalink: /projects/:path/
  # Case study pages for the Webmaps and visualisations index. Prose lives in
  # _webmaps/<slug>.md; everything structured (title, year, locations,
  # links, media, facts) stays in assets/data/maps.json, matched by slug.
  webmaps:
    output: true
    permalink: /webmaps-and-visualisations/:path/

defaults:
  - scope:
      path: ""
      type: webmaps
    values:
      layout: webmap-case-study