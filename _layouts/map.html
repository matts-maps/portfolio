<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

{{ content }}

{% include image-filter-bar.html %}

<div id="leaflet-map-canvas" style="height: 600px; width: 100%; border-radius: 6px; border: 1px solid #ccc; margin-top: 20px;"></div>

{% include image-lightbox.html %}

<script type="module">
  import { images } from "{{ site.baseurl }}/assets/js/image-data.js";
  import { initFilterEngine, SORT } from "{{ site.baseurl }}/assets/js/filter-engine.js";
  import { initLightbox } from "{{ site.baseurl }}/assets/js/image-lightbox.js";

  // Import our clean map logic module
  import { initMapBase, renderMapMarkers } from "{{ site.baseurl }}/assets/js/image-map.js";

  document.addEventListener("DOMContentLoaded", () => {
    initLightbox();
    initMapBase();

    // Wire up the filtering engine to pass data subsets straight to our map generator
    initFilterEngine(images, renderMapMarkers, {
      searchEl: "ife-search",
      searchFields: ["name", "country", "location"],
      sortEl: "ife-sort",
      resetEl: "reset-filters",
      fields: [
        { key: "continent", elId: "ife-continent" },
        { key: "country", elId: "ife-country", arrayValued: true },
        { key: "disaster", elId: "ife-disaster", arrayValued: true, groups: { "tropical-cyclone": ["Cyclone", "Hurricane", "Typhoon"] } },
        { key: "theme", prop: "themes", elId: "ife-theme", arrayValued: true },
        { key: "year", elId: "ife-year", optionOrder: "desc-numeric" }
      ],
      sort: {
        alpha: SORT.alpha,
        theme: SORT.byFirstOf("themes"),
        yearmonth: SORT.yearmonth
      }
    });
  });
</script>
