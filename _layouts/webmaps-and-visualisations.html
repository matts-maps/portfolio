---
layout: default
---

<div class="container site-width-container">
  <!-- Full-Width Hero Section -->
  <div class="webmaps-hero-section">
    <div class="markdown-content">
      {{ content }}
    </div>
  </div>

  <!-- Interactive Dashboard Workspace -->
  <div class="split-dashboard-wrapper">
    
    <!-- LEFT PANEL (2/3 Width): The Primary Webmap Visual Embed Viewport or Fallback Image -->
    <div class="visual-viewport-pane">
      <iframe id="live-webmap-frame" src="" frameborder="0" allowfullscreen allow="geolocation; clipboard-write"></iframe>
      
      <!-- Native Screenshot Fallback Overlay UI -->
      <div id="visual-fallback-container" class="visual-fallback-container hidden">
        <img id="fallback-screenshot-img" src="" alt="Project Visual Preview Screenshot">
        
        <!-- Modified to include a unique ID for dynamic visibility toggling -->
        <div id="fallback-cta-card" class="fallback-overlay-cta hidden">
          <p>This interactive dashboard layout restricts external embedding views.</p>
          <a id="fallback-direct-btn" href="" target="_blank" rel="noopener noreferrer" class="btn-primary">View Interactive Dashboard externally ↗</a>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL (1/3 Width): Locator Map & Clean Description Card Stack -->
    <div class="meta-locator-sidebar">
      
      <!-- Top Component: Leaflet Locator Map Window -->
      <div id="locator-map-canvas"></div>

      <!-- Bottom Component: Contextual Metadata Card -->
      <div class="description-content-pane">
        <div id="dynamic-project-details" class="portfolio-project-card">
          
          <!-- Styled Project Title -->
          <div id="meta-name" class="project-title-display"></div>
          
          <!-- Metadata Subtitle Line (Location, Country · Disaster · Year) -->
          <div class="project-subtitle-meta">
            <span id="meta-combined-subtitle"></span>
          </div>
          
          <!-- Narrative Description Text Segment -->
          <div class="project-description-body">
            <p id="meta-description"></p>
            <!-- Appended External Context Link Holder -->
            <div id="meta-external-link-wrapper" class="project-external-link-container"></div>
          </div>
          
        </div>
      </div>

    </div>

  </div>
</div>

<!-- Leaflet API Requirements Mapping Dependencies -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script type="module">
  import { visualizationProjects } from '{{ site.baseurl }}/assets/js/webmaps-and-visualisations-data.js';

  document.addEventListener("DOMContentLoaded", function () {
    const map = L.map('locator-map-canvas', {
      zoomControl: true,
      attributionControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }).addTo(map);

    const customDotIcon = L.divIcon({
      className: 'custom-locator-dot',
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });

    const liveWebmapFrame = document.getElementById('live-webmap-frame');
    const fallbackContainer = document.getElementById('visual-fallback-container');
    const fallbackImg = document.getElementById('fallback-screenshot-img');
    const fallbackCtaCard = document.getElementById('fallback-cta-card');
    const fallbackBtn = document.getElementById('fallback-direct-btn');
    const externalLinkWrapper = document.getElementById('meta-external-link-wrapper');
    
    const markerMap = new Map();
    const markerGroup = L.featureGroup();

    // UI Project Hydration Engine
    function loadProjectIntoDashboard(project, marker) {
      markerMap.forEach((m) => m.getElement()?.classList.remove('focused-dot'));
      if (marker && marker.getElement()) {
        marker.getElement().classList.add('focused-dot');
      }

      const projectUrl = (project.links && project.links.length > 0) ? project.links[0].url : "";
      const labelText = (project.links && project.links.length > 0) ? project.links[0].label : "Open data source";

      // Toggle between interactive frame vs image fallback state
      if (project.screenshot && project.screenshot.trim() !== "") {
        liveWebmapFrame.classList.add('hidden');
        fallbackContainer.classList.remove('hidden');
        
        fallbackImg.src = `{{ site.baseurl }}/assets/images/webmap-and-visuals-screenshots/${project.screenshot}`;
        fallbackBtn.href = projectUrl;
        liveWebmapFrame.src = ""; 

        // CRITICAL UPDATE: Text overlay shows only if explicitly flagged as non-embeddable
        if (project.embeddable === false) {
          fallbackCtaCard.classList.remove('hidden');
        } else {
          fallbackCtaCard.classList.add('hidden');
        }
      } else {
        fallbackContainer.classList.add('hidden');
        fallbackCtaCard.classList.add('hidden');
        liveWebmapFrame.classList.remove('hidden');
        
        if (projectUrl) {
          liveWebmapFrame.src = projectUrl;
        }
      }

      // Populate Title & Description Content
      document.getElementById('meta-name').textContent = project.name;
      document.getElementById('meta-description').textContent = project.description || "No project overview summary provided.";

      // Append clean external link to the end of the narrative text layout block
      externalLinkWrapper.innerHTML = "";
      if (projectUrl) {
        const linkElement = document.createElement('a');
        linkElement.href = projectUrl;
        linkElement.target = "_blank";
        linkElement.rel = "noopener noreferrer";
        linkElement.className = "project-narrative-link";
        linkElement.innerHTML = `View Live Map Source: <strong>${labelText} ↗</strong>`;
        externalLinkWrapper.appendChild(linkElement);
      }

      // Build the Clean Metadata Subtitle String Dynamically
      const countryStr = Array.isArray(project.country) ? project.country.filter(c => c && c.trim() !== "").join(', ') : project.country;
      let locationCountry = "";
      if (project.location && project.location.trim() !== "") {
        locationCountry = countryStr ? `${project.location.trim()}, ${countryStr}` : project.location.trim();
      } else {
        locationCountry = countryStr;
      }

      const subtitleSegments = [];
      if (locationCountry && locationCountry.trim() !== "") subtitleSegments.push(locationCountry);
      if (project.disaster && project.disaster.trim() !== "") subtitleSegments.push(project.disaster.trim());
      if (project.year) subtitleSegments.push(project.year);

      document.getElementById('meta-combined-subtitle').textContent = subtitleSegments.join(' · ');
    }

    // Map feature loop processing
    visualizationProjects.forEach(project => {
      if (!project.lat || !project.lng) return;

      const marker = L.marker([project.lat, project.lng], { icon: customDotIcon });
      marker.addTo(markerGroup);
      markerMap.set(project, marker);

      marker.on('click', function (e) {
        map.panTo(e.latlng);
        loadProjectIntoDashboard(project, marker);
      });
    });

    markerGroup.addTo(map);

    // Initial Execution Default Settings
    if (visualizationProjects && visualizationProjects.length > 0) {
      const sortedProjects = [...visualizationProjects].sort((a, b) => parseInt(b.year) - parseInt(a.year));
      const latestProject = sortedProjects[0];
      const latestMarker = markerMap.get(latestProject);

      if (markerGroup.getLayers().length > 0) {
        map.fitBounds(markerGroup.getBounds(), {
          padding: [30, 30],
          maxZoom: 5
        });
      }

      if (latestProject) {
        loadProjectIntoDashboard(latestProject, latestMarker);
      }
    } else {
      map.setView([10, -20], 1.5);
    }
  });
</script>

<style>
  .site-width-container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px;
  }

  .webmaps-hero-section {
    margin-bottom: 24px;
  }
  .webmaps-hero-section .markdown-content h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #1a202c;
    margin: 0 0 12px 0;
  }
  .webmaps-hero-section .markdown-content p {
    font-size: 1rem;
    color: #4a5568;
    line-height: 1.5;
    margin: 0;
  }

  .split-dashboard-wrapper {
    display: flex;
    width: 100%;
    height: 800px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    overflow: hidden;
    background: #ffffff;
  }

  /* Left Panel Viewport Layout Area */
  .visual-viewport-pane {
    flex: 0 0 66.6666%;
    width: 66.6666%;
    height: 100%;
    background: #f7fafc;
    position: relative;
    border-right: 1px solid #e2e8f0;
    box-sizing: border-box;
  }
  #live-webmap-frame {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background: #ffffff;
  }
  
  /* Fallback Layer Layout Structure */
  .visual-fallback-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .visual-fallback-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.45;
    filter: blur(1px);
  }
  .fallback-overlay-cta {
    position: absolute;
    text-align: center;
    padding: 20px;
    max-width: 80%;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    color: #1a202c;
  }
  .fallback-overlay-cta p {
    margin: 0 0 16px 0;
    font-size: 1rem;
    font-weight: 500;
  }
  .btn-primary {
    display: inline-block;
    background: #3182ce;
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.2s;
  }
  .btn-primary:hover {
    background: #2b6cb0;
  }

  .meta-locator-sidebar {
    flex: 0 0 33.3333%;
    width: 33.3333%;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #fafafa;
  }

  #locator-map-canvas {
    width: 100%;
    height: 320px;
    border-bottom: 1px solid #e2e8f0;
    background: #edf2f7;
    z-index: 1;
  }

  .description-content-pane {
    flex-grow: 1;
    padding: 24px;
    overflow-y: auto;
    box-sizing: border-box;
    background: #ffffff;
  }

  .portfolio-project-card {
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  .project-title-display {
    margin: 0 0 8px 0;
    font-size: 1.35rem;
    line-height: 1.4;
    color: #1a202c;
    font-weight: 700;
  }
  .project-subtitle-meta {
    font-size: 0.9rem;
    color: #4a5568;
    line-height: 1.5;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .project-description-body {
    border-top: 1px dashed #e2e8f0;
    padding-top: 16px;
  }
  .project-description-body p {
    font-size: 0.925rem;
    line-height: 1.6;
    color: #4a5568;
    margin: 0 0 12px 0;
  }

  /* Appended External Narrative Link Component styling */
  .project-external-link-container {
    margin-top: 14px;
  }
  .project-narrative-link {
    font-size: 0.9rem;
    color: #3182ce;
    text-decoration: none;
    display: inline-block;
    transition: color 0.15s ease;
  }
  .project-narrative-link:hover {
    color: #2b6cb0;
    text-decoration: underline;
  }

  .custom-locator-dot {
    background-color: #3182ce;
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.4);
    transition: all 0.2s ease;
  }
  .focused-dot {
    background-color: #e53e3e !important;
    box-shadow: 0 0 0 4px rgba(229, 62, 62, 0.4) !important;
    transform: scale(1.2);
  }

  /* Helper Class utilities */
  .hidden {
    display: none !important;
  }

  @media (max-width: 1024px) {
    .split-dashboard-wrapper {
      flex-direction: column;
      height: auto;
    }
    .visual-viewport-pane {
      width: 100%;
      flex: none;
      height: 500px;
    }
    .meta-locator-sidebar {
      width: 100%;
      flex: none;
    }
    #locator-map-canvas {
      height: 250px;
    }
  }
</style>
