---
layout: default
---

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="{{ '/assets/css/webmaps.css' | relative_url }}">

<div class="webmaps-page"
     id="webmaps-page"
     data-site-base="{{ '/' | relative_url }}"
     data-case-base="{{ '/webmaps-and-visualisations/' | relative_url }}">

  {{ content }}

  {% include webmap-filter-bar.html %}

  <div class="webmaps-layout">

    <section class="webmaps-results" aria-label="Webmaps and visualisations">
      <p id="webmaps-count" class="webmaps-count" aria-live="polite"></p>
      <ul id="webmaps-grid" class="webmaps-grid"></ul>
      <p id="webmaps-empty" class="webmaps-empty" hidden>
        Nothing matches these filters. Use Reset to see everything again.
      </p>

      <noscript>
        <ul class="webmaps-noscript-list">
          {% for doc in site.webmaps %}
            <li><a href="{{ doc.url | relative_url }}">{{ doc.title }}</a></li>
          {% endfor %}
        </ul>
      </noscript>
    </section>

    <aside class="webmaps-side" aria-label="Map and selected item">
      <div class="webmaps-map-frame">
        <div id="webmaps-map" class="webmaps-map" role="region" aria-label="Map of where each item is based. Every item on the map is also in the list."></div>
      </div>

      <div id="webmaps-unplaced" class="webmaps-unplaced" hidden>
        <h2 class="webmaps-unplaced__heading">Not tied to one place</h2>
        <ul id="webmaps-unplaced-list" class="webmaps-unplaced__list"></ul>
      </div>

      <div id="webmaps-selected" class="webmaps-selected" aria-live="polite"></div>
    </aside>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script type="module" src="{{ '/assets/js/webmaps-index.js' | relative_url }}"></script>
