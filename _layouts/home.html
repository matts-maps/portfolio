---
layout: default
---

<link rel="stylesheet" href="{{ '/assets/css/masonry.css' | relative_url }}">

{{ content }}

{% include image-filter-bar.html %}

<div class="gallery-grid" id="gallery-grid"></div>

{% include image-lightbox.html %}

<script type="module">
  import { images } from "{{ site.baseurl }}/assets/js/image-data.js";
  import { initImageFilterEngine } from "{{ site.baseurl }}/assets/js/image-filter-engine.js";
  import { initLightbox, updateLightboxPool, launchLightbox } from "{{ site.baseurl }}/assets/js/image-lightbox.js";

  const baseUrl = "{{ site.baseurl }}";

  function renderGrid(filteredItems) {
    const grid = document.getElementById('gallery-grid');
    if (!grid) return;
    grid.innerHTML = '';

    // Track active subset items inside global lightbox contextual pool
    updateLightboxPool(filteredItems);

    if (filteredItems.length === 0) {
      grid.innerHTML = '<p class="no-results" style="column-span: all; text-align: center; color: var(--text); padding: 40px 0;">No maps match your filter selections.</p>';
      return;
    }

    filteredItems.forEach((item, index) => {
      const title = item.name || "Untitled Map";
      
      // --- THUMBNAIL LOGIC CONFIGURATION ---
      // Swaps "assets/images/maps/" with "assets/images/maps/thumbs/"
      let thumbUrl = '';
      if (item.file) {
        thumbUrl = `${baseUrl}/${item.file.replace('assets/images/maps/', 'assets/images/maps/thumbs/')}`;
      }
      // -------------------------------------

      // --- CAPTION FORMATTING LOGIC ---
      const line2Parts = [];

      // 1. Handle Location and Country combination
      if (item.location) {
        line2Parts.push(`${item.location}, ${item.country || 'Global'}`);
      } else if (item.country) {
        line2Parts.push(item.country);
      } else {
        line2Parts.push('Global');
      }

      // 2. Add Disaster if it exists and handles both Single String and Array structures safely
      if (item.disaster) {
        const disasterList = Array.isArray(item.disaster) ? item.disaster : [item.disaster];
        const activeDisasters = disasterList.filter(d => d && d !== 'None');
        
        if (activeDisasters.length > 0) {
          line2Parts.push(activeDisasters.join(', '));
        }
      }

      // 3. Add Year if it exists
      if (item.year) {
        line2Parts.push(item.year);
      }

      // Join everything cleanly with a dash delimiter
      const line2Text = line2Parts.join(' · ');
      // --------------------------------

      const card = document.createElement('div');
      card.className = 'gallery-card';
      
      // The gallery interface renders using the high-performance thumbUrl
      card.innerHTML = `
        <div class="card-image-wrapper">
          <img src="${thumbUrl}" alt="${title}" onerror="this.src='${baseUrl}/assets/images/placeholder.jpg'">
          <div class="card-overlay-caption">
            <div class="overlay-caption-content">
              <h3>${title}</h3>
              <p class="card-meta">${line2Text}</p>
            </div>
          </div>
        </div>
      `;
      
      // The lightbox event handler passes the whole 'item', ensuring full-resolution views remain intact
      card.addEventListener('click', () => launchLightbox(item));
      grid.appendChild(card);

      // Stagger entry phase to execute fade-in transition cleanly
      setTimeout(() => {
        card.classList.add('visible');
      }, index * 30);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    initLightbox();
    initImageFilterEngine(images, renderGrid);
  });
</script>
