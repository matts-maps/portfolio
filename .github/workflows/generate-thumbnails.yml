name: Generate Thumbnails

on:
  push:
    paths:
      - "assets/images/maps/**"
      - "assets/images/webmaps/**"
      - ".github/workflows/generate-thumbnails.yml"

permissions:
  contents: write

jobs:
  build-thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sharp
        run: npm install sharp

      - name: Generate thumbnails
        run: |
          mkdir -p assets/images/maps/thumbs
          node << 'EOF'
          import fs from "fs";
          import sharp from "sharp";

          const inputDir = "assets/images/maps";
          const outputDir = "assets/images/maps/thumbs";

          const files = fs.readdirSync(inputDir).filter(f =>
            /\.(jpg|jpeg|png)$/i.test(f)
          );

          for (const file of files) {
            const input = `${inputDir}/${file}`;
            const output = `${outputDir}/${file}`;

            // Skip if thumbnail already exists
            if (fs.existsSync(output)) {
              console.log("Skipping existing:", file);
              continue;
            }

            sharp(input)
              .resize(600)
              .jpeg({ quality: 70 })
              .toFile(output)
              .then(() => console.log("Created:", file))
              .catch(err => console.error("Error:", file, err));
          }
          EOF

      - name: Generate webmap preview thumbnails
        # Index cards load assets/images/webmaps/<slug>/thumbs/poster.jpg
        # (640 pixels wide) instead of the full 1280 pixel poster. Always
        # rebuilt, so a re-captured poster gets a fresh thumbnail; unchanged
        # images produce identical files and so no commit.
        run: |
          node --input-type=module << 'EOF'
          import fs from "fs";
          import path from "path";
          import sharp from "sharp";

          const root = "assets/images/webmaps";
          if (!fs.existsSync(root)) process.exit(0);

          for (const slug of fs.readdirSync(root)) {
            const dir = path.join(root, slug);
            if (!fs.statSync(dir).isDirectory()) continue;
            const thumbs = path.join(dir, "thumbs");
            const files = fs.readdirSync(dir).filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f));
            if (files.length) fs.mkdirSync(thumbs, { recursive: true });

            for (const file of files) {
              const input = path.join(dir, file);
              const output = path.join(thumbs, file);
              await sharp(input).resize(640).toFile(output);
              console.log("Created:", output);
            }
          }
          EOF

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add assets/images/maps/thumbs
            git add assets/images/webmaps
            git commit -m "Auto-generate thumbnails"
            git push
          else
            echo "No changes to commit"
          fi
