<div id="project-filter-bar">

  <button type="button" id="project-filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="project-filter-bar">
    Filters <span class="filter-toggle-icon">▾</span>
  </button>

  <div class="filter-group">
    <label>Sort</label>
    <select id="sort-select">
      <option value="yearmonth" selected>Date (Newest)</option>
      <option value="year">Year Only</option>
      <option value="alpha">Alphabetical</option>
      <option value="type">Type</option> </select>
  </div>

  <div class="filter-group">
    <label>Continent</label>
    <select id="filter-continent">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Country</label>
    <select id="filter-country">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Disaster</label>
    <select id="filter-disaster">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Type</label> <select id="filter-type"> <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Modality</label>
    <select id="filter-modality">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Status</label>
    <select id="filter-status">
      <option value="">All</option>
    </select>
  </div>

  <button id="reset-filters">Reset</button>
</div>
