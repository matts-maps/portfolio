<div id="image-filter-bar" class="filter-bar">
  <button type="button" id="image-filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="image-filter-bar">
    Filters <span class="filter-toggle-icon">▾</span>
  </button>
  <div class="filter-row">
    
    <div class="filter-group">
      <label>Sort</label>
      <select id="ife-sort">
        <option value="yearmonth">Date (Newest)</option>
        <option value="alpha">A → Z</option>
        <option value="theme">Theme</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Continent</label>
      <select id="ife-continent"><option value="">All</option></select>
    </div>

    <div class="filter-group">
      <label>Country</label>
      <select id="ife-country"><option value="">All</option></select>
    </div>

    <div class="filter-group">
      <label>Disaster</label>
      <select id="ife-disaster">
        <option value="">All</option>
        <option value="tropical-cyclone">Cyclone / Hurricane / Typhoon</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Theme</label>
      <select id="ife-theme"><option value="">All</option></select>
    </div>

    <div class="filter-group">
      <label>Year</label>
      <select id="ife-year"><option value="">All</option></select>
    </div>

  <button id="reset-filters">Reset</button>
  </div>
</div>
